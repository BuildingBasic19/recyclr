<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password — Recyclr</title>
<link rel="stylesheet" href="styles.css">

<style>
.reset-box{
  max-width:520px;
  margin:45px auto;
}

.reset-step{
  display:none;
}

.reset-step.active{
  display:block;
}

.small-note{
  font-size:13px;
  margin-top:8px;
}
</style>
</head>

<body>

<header class="nav">
  <div class="container nav-inner">
    <a class="logo" href="index.html">♻️ Recyclr</a>
    <a class="btn outline" href="login.html">← Login</a>
  </div>
</header>

<main class="page">

<div class="card form reset-box">

  <div style="text-align:center">
    <div style="font-size:55px">🔐</div>
    <h1>Reset Password</h1>
    <p class="muted">
      We'll send a verification code to your email.
    </p>
  </div>


  <!-- STEP 1 -->

  <div id="step1" class="reset-step active">

    <form id="emailForm">

      <label>Email</label>

      <input
        id="email"
        type="email"
        required
        placeholder="you@example.com"
      >

      <button
        class="btn primary"
        type="submit"
        style="width:100%;margin-top:20px"
      >
        Send OTP
      </button>

    </form>

  </div>


  <!-- STEP 2 -->

  <div id="step2" class="reset-step">

    <p class="muted">
      Enter the OTP sent to your email.
    </p>

    <form id="resetForm">

      <label>OTP</label>

      <input
        id="code"
        type="text"
        inputmode="numeric"
        maxlength="6"
        required
        placeholder="6-digit OTP"
      >

      <label>New Password</label>

      <input
        id="newPassword"
        type="password"
        minlength="8"
        required
        placeholder="At least 8 characters"
      >

      <label>Confirm New Password</label>

      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        required
        placeholder="Enter password again"
      >

      <button
        class="btn primary"
        type="submit"
        style="width:100%;margin-top:20px"
      >
        Reset Password
      </button>

    </form>

  </div>

  <p
    id="message"
    class="muted"
    style="text-align:center;margin-top:18px"
  ></p>

  <p
    style="text-align:center;margin-top:20px"
  >
    <a
      href="login.html"
      style="color:var(--green);font-weight:800"
    >
      Back to Login
    </a>
  </p>

</div>

</main>

<div id="toast" class="toast"></div>

<script src="config.js"></script>

<script>
const API =
  (window.RECYCLR_CONFIG?.API_BASE_URL || '')
  .replace(/\/$/, '');

const $ = s => document.querySelector(s);

function showMessage(msg){
  $('#message').textContent = msg;
}

$('#emailForm').addEventListener('submit', async e => {

  e.preventDefault();

  const email = $('#email').value.trim().toLowerCase();

  try {

    showMessage('Sending OTP...');

    const response = await fetch(
      `${API}/api/auth/forgot-password`,
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({email})
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || 'Unable to send OTP');
    }

    localStorage.setItem(
      'recyclrResetEmail',
      email
    );

    $('#step1').classList.remove('active');
    $('#step2').classList.add('active');

    showMessage(
      'If an account exists, a reset OTP has been sent to your email.'
    );

  } catch(err){

    showMessage(err.message);

  }

});


$('#resetForm').addEventListener('submit', async e => {

  e.preventDefault();

  const email =
    localStorage.getItem('recyclrResetEmail') || '';

  const code =
    $('#code').value.trim();

  const newPassword =
    $('#newPassword').value;

  const confirmPassword =
    $('#confirmPassword').value;

  if(newPassword !== confirmPassword){
    showMessage('Passwords do not match.');
    return;
  }

  try {

    showMessage('Resetting password...');

    const response = await fetch(
      `${API}/api/auth/reset-password`,
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          email,
          code,
          newPassword
        })
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.error || 'Unable to reset password'
      );
    }

    localStorage.removeItem(
      'recyclrResetEmail'
    );

    showMessage(
      'Password reset successfully. Redirecting to login...'
    );

    setTimeout(() => {
      location.href = 'login.html';
    }, 1500);

  } catch(err){

    showMessage(err.message);

  }

});
</script>

</body>
</html>
